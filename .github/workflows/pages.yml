name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve API base URL
        env:
          API_BASE_VAR: ${{ vars.API_BASE }}
          API_BASE_SECRET: ${{ secrets.API_BASE }}
        run: |
          if [ -n "$API_BASE_VAR" ]; then
            echo "API_BASE=$API_BASE_VAR" >> "$GITHUB_ENV"
          elif [ -n "$API_BASE_SECRET" ]; then
            echo "API_BASE=$API_BASE_SECRET" >> "$GITHUB_ENV"
          else
            echo "::error::Set repository variable API_BASE (or secret API_BASE) to the Render URL, for example https://lista-desejos-api.onrender.com"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /lista-desejos-frontend/ --dart-define=API_BASE="${API_BASE}"

      - name: Pages extras
        run: |
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
