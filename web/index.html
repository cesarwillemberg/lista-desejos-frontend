<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lista de desejos. Cole o link de um produto e guarde a foto e o preço.">
  <meta name="theme-color" content="#241C17">
  <style>
    html, body { margin: 0; background: #F3EEE6; height: 100%; }
    #wishly-splash {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #F3EEE6;
      color: #241C17;
    }
    #wishly-splash h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 600;
      font-size: 64px;
      letter-spacing: -0.03em;
    }
    #wishly-splash p {
      margin: 12px 0 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 16px;
      color: #746C62;
    }
  </style>

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wishly">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Wishly — lista de desejos</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="wishly-splash">
    <h1>Wishly</h1>
    <p>Suas listas de desejos</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('wishly-splash');
      if (splash) splash.remove();
    });
  </script>
  <script>
    window.wishlyInstall = null;
    window.wishlyCanInstall = function () { return !!window.wishlyInstall; };
    window.wishlyPromptInstall = function () {
      if (!window.wishlyInstall) return;
      window.wishlyInstall.prompt();
      window.wishlyInstall = null;
    };
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.wishlyInstall = event;
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
